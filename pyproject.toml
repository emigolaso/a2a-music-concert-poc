[project]
name = "a2a-music-concert-poc"
version = "0.1.0"
description = "Spotify MCP + OpenAI agent + LangGraph concert agent exposed as A2A agents for watsonx Orchestrate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]>=0.3.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "langgraph>=0.2.0",
  "litellm>=1.74.0",
  "mcp[cli]>=1.13.0",
  "openai-agents>=0.2.2",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_music_concert"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
